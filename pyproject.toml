[project]
name = "dequant-engine"
version = "0.1.0"
description = "Automated tensor-network baseline generator for PennyLane QNNs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pennylane>=0.39",
    "quimb>=1.8",
    "torch>=2.3",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dequant_engine"]
